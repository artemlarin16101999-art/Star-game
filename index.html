<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web 3D Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; pointer-events: none; }
        #joystick {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            touch-action: none;
        }
        #btnShoot {
            position: absolute; bottom: 50px; right: 50px;
            width: 90px; height: 90px;
            background: rgba(255,0,0,0.6); border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 90px;
            user-select: none; font-size: 18px; touch-action: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">Попаданий: <span id="score">0</span></div>
    <div id="joystick"></div>
    <div id="btnShoot">ОГОНЬ</div>

    <script>
        // 1. Сцена и камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        scene.fog = new THREE.Fog(0x87CEEB, 10, 60); // Туман для атмосферы

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; // Рост игрока

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Освещение
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 3. Мир (Пол и Стены)
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const wallMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for (let i = 0; i < 15; i++) {
            const boxGeo = new THREE.BoxGeometry(3, 5, 3);
            const box = new THREE.Mesh(boxGeo, wallMat);
            box.position.set((Math.random() - 0.5) * 50, 2.5, (Math.random() - 0.5) * 50);
            scene.add(box);
        }

        // 4. Враги (Красные шары)
        let targets = [];
        let score = 0;
        
        function spawnTarget() {
            const targetGeo = new THREE.SphereGeometry(1, 16, 16);
            const targetMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const target = new THREE.Mesh(targetGeo, targetMat);
            
            // Спавн в случайном месте, но не слишком близко к игроку
            let x = (Math.random() - 0.5) * 40;
            let z = (Math.random() - 0.5) * 40;
            if (Math.hypot(x, z) < 5) { x += 10; z += 10; } // Чтобы не спавнились на голове
            
            target.position.set(x, 1, z);
            scene.add(target);
            targets.push(target);
        }
        for(let i = 0; i < 10; i++) spawnTarget();

        // 5. Управление (ПК + Телефон)
        let moveX = 0, moveY = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Мобильный джойстик (Левая часть экрана)
        const joy = document.getElementById('joystick');
        let joyTouchId = null;
        
        joy.addEventListener('touchstart', e => { e.preventDefault(); joyTouchId = e.changedTouches[0].identifier; }, {passive: false});
        joy.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) {
                    let rect = joy.getBoundingClientRect();
                    let dx = t.clientX - (rect.left + rect.width/2);
                    let dy = t.clientY - (rect.top + rect.height/2);
                    moveX = Math.max(-1, Math.min(1, dx / 60)); 
                    moveY = Math.max(-1, Math.min(1, dy / 60));
                }
            }
        }, {passive: false});
        joy.addEventListener('touchend', e => { e.preventDefault(); joyTouchId = null; moveX = 0; moveY = 0; }, {passive: false});

        // Поворот камеры (Свайп по экрану)
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;
        renderer.domElement.addEventListener('touchstart', e => {
            for(let t of e.changedTouches) {
                // Если касание не на джойстике и не на кнопке стрельбы
                if(t.clientX > window.innerWidth / 3 && t.clientX < window.innerWidth - 150) {
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });
        renderer.domElement.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === lookTouchId) {
                    let dx = t.clientX - lastTouchX;
                    let dy = t.clientY - lastTouchY;
                    camera.rotation.y -= dx * 0.005;
                    camera.rotation.x -= dy * 0.005;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, {passive: false});
        renderer.domElement.addEventListener('touchend', () => { lookTouchId = null; });

        // 6. Стрельба
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0); // Прицел в центре

        function shoot() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(targets);
            
            if (intersects.length > 0) {
                // Попали!
                scene.remove(intersects[0].object);
                targets = targets.filter(t => t !== intersects[0].object);
                score++;
                document.getElementById('score').innerText = score;
                spawnTarget(); // Спавним нового
            }
        }

        // Кнопка стрельбы на телефоне
        document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, {passive: false});
        // Клик мышкой на ПК
        window.addEventListener('mousedown', (e) => { if(e.button === 0 && !('ontouchstart' in window)) shoot(); });

        // Захват мыши на ПК
        renderer.domElement.addEventListener('click', () => {
            if(!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // 7. Главный цикл (Игровой движок)
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            let delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            let speed = 8 * delta;
            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            
            // Ввод (Клавиатура и Джойстик)
            let fwdInput = 0, rightInput = 0;
            if(keys['KeyW'] || keys['ArrowUp']) fwdInput += 1;
            if(keys['KeyS'] || keys['ArrowDown']) fwdInput -= 1;
            if(keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
            if(keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
            
            fwdInput -= moveY; 
            rightInput += moveX;

            // Двигаем камеру
            camera.position.addScaledVector(forward, fwdInput * speed);
            camera.position.addScaledVector(right, rightInput * speed);
            camera.position.y = 1.6; // Жестко фиксируем высоту

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
