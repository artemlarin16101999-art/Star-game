<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Web 3D Shooter: Click & Play</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/trystero@0.21.0/dist/trystero-mqtt.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* --- ОШИБКИ --- */
        #errorOverlay { position: absolute; top: 0; left: 0; width: 100%; background: red; color: white; z-index: 9999; display: none; padding: 10px; font-size: 14px; font-weight: bold; }

        /* --- МЕНЮ --- */
        #authScreen, #menu, #shopMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 200; }
        #menu, #shopMenu { background: rgba(0,0,0,0.85); display: none; }
        .input-box { padding: 12px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #555; background: #222; color: white; width: 250px; text-align: center; }
        .btn { padding: 12px 20px; margin: 5px; font-size: 16px; border: none; border-radius: 5px; background: #ffcc00; color: black; font-weight: bold; cursor: pointer; width: 250px; }
        .btn-green { background: #00ff00; font-size: 20px; padding: 15px; }
        .btn-red { background: #ff4444; color: white; }
        .btn-small { width: auto; padding: 10px 15px; font-size: 14px; }
        .shop-item { background: #333; padding: 10px 15px; margin: 5px; border-radius: 10px; width: 300px; display: flex; justify-content: space-between; align-items: center; }

        /* --- HUD --- */
        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); }
        #stats { position: absolute; top: 20px; left: 20px; color: white; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
        #killfeed { position: absolute; top: 80px; right: 20px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; font-size: 14px; text-align: right; }

        /* --- УПРАВЛЕНИЕ --- */
        #joystick { display: none; position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; touch-action: none; z-index: 100; border: 2px solid rgba(255,255,255,0.3); }
        #joyKnob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }
        #btnShoot { display: none; position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; background: rgba(255,0,0,0.6); border-radius: 50%; color: white; font-size: 20px; font-weight: bold; text-align: center; line-height: 100px; touch-action: none; z-index: 100; border: 2px solid #ff0000; }
        #exitBtn { position: absolute; top: 20px; right: 20px; padding: 10px; background: red; color: white; border: none; border-radius: 5px; z-index: 200; display: none; }
    </style>
</head>
<body>
    <div id="errorOverlay"></div>

    <div id="authScreen">
        <h1 style="color:#ffcc00;">ВХОД</h1>
        <input type="text" id="authUser" class="input-box" placeholder="Никнейм">
        <input type="password" id="authPass" class="input-box" placeholder="Пароль">
        <button class="btn" onclick="login()">ВОЙТИ</button>
    </div>

    <div id="menu">
        <h1>3D SHOOTER</h1>
        <p>Игрок: <span id="menuUser" style="color:#00ff00;"></span></p>
        <p>Монеты: <span id="menuCoins">0</span> 🪙</p>
        <button class="btn btn-green" onclick="joinGlobalGame()">В БОЙ (Онлайн)</button>
        <button class="btn" onclick="openShop()">МАГАЗИН</button>
        <div style="margin-top: 20px; display:flex; gap: 5px;">
            <input type="text" id="promoInput" placeholder="Промокод" style="padding:10px; border-radius:5px; border:none; width: 150px;">
            <button class="btn btn-small" style="background:#00ccff;" onclick="applyPromo()">ОК</button>
        </div>
    </div>

    <div id="shopMenu">
        <h1>МАГАЗИН</h1>
        <p>Монеты: <span id="shopCoins">0</span> 🪙</p>
        <div class="shop-item">
            <span>Винтовка</span>
            <button class="btn btn-small" onclick="buyWeapon('rifle', 100)">100</button>
        </div>
        <div class="shop-item">
            <span>Снайперка</span>
            <button class="btn btn-small" onclick="buyWeapon('sniper', 300)">300</button>
        </div>
        <button class="btn btn-red" style="margin-top:20px;" onclick="closeShop()">НАЗАД</button>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="stats">Загрузка...</div>
        <div id="killfeed"></div>
        <button id="exitBtn" onclick="location.reload()">ВЫЙТИ</button>
    </div>

    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="btnShoot">ОГОНЬ</div>

    <script>
        // Вывод ошибок на экран
        window.addEventListener('error', function(e) {
            let err = document.getElementById('errorOverlay');
            err.style.display = 'block';
            err.innerText = "ОШИБКА: " + e.message;
        });

        // ==========================================
        // 1. АККАУНТЫ
        // ==========================================
        let currentUser = null;
        let save = { coins: 0, weapons: ["pistol"], activeWeapon: "pistol", usedPromos: [] };
        const WEAPONS = {
            pistol: { name: "Пистолет", dmg: 20, rate: 300 },
            rifle: { name: "Винтовка", dmg: 35, rate: 150 },
            sniper: { name: "Снайперка", dmg: 100, rate: 1500 }
        };

        function login() {
            let u = document.getElementById('authUser').value.trim();
            let p = document.getElementById('authPass').value;
            if(!u || !p) return alert("Заполни ник и пароль!");
            let savedPass = localStorage.getItem('fps_pass_' + u);
            if (savedPass) { if (savedPass !== p) return alert("Неверный пароль!"); } 
            else { localStorage.setItem('fps_pass_' + u, p); }
            currentUser = u; localStorage.setItem('fps_active_user', u);
            loadSave(); showMenu();
        }

        function loadSave() {
            let s = localStorage.getItem('fps_save_' + currentUser);
            if (s) { save = JSON.parse(s); if(!save.usedPromos) save.usedPromos = []; } 
            else { save = { coins: 0, weapons: ["pistol"], activeWeapon: "pistol", usedPromos: [] }; saveData(); }
            updateCoins();
        }

        function saveData() { if(currentUser) localStorage.setItem('fps_save_' + currentUser, JSON.stringify(save)); }
        function showMenu() { document.getElementById('authScreen').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; document.getElementById('menuUser').innerText = currentUser; }
        function updateCoins() { document.getElementById('menuCoins').innerText = save.coins; document.getElementById('shopCoins').innerText = save.coins; }
        window.onload = () => { let a = localStorage.getItem('fps_active_user'); if(a) { currentUser = a; loadSave(); showMenu(); } };

        function applyPromo() {
            if (document.getElementById('promoInput').value.trim() === "Петушара2026") {
                if (save.usedPromos.includes("Петушара2026")) return alert("Уже активирован!");
                save.coins += 1000; save.usedPromos.push("Петушара2026"); saveData(); updateCoins(); alert("+1000 монет!");
            } else alert("Неверный код.");
        }
        function openShop() { document.getElementById('menu').style.display = 'none'; document.getElementById('shopMenu').style.display = 'flex'; }
        function closeShop() { document.getElementById('shopMenu').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; }
        function buyWeapon(w, price) {
            if (save.coins >= price && !save.weapons.includes(w)) {
                save.coins -= price; save.weapons.push(w); save.activeWeapon = w;
                saveData(); updateCoins(); alert("Куплено!");
            } else alert("Не хватает или уже куплено!");
        }

        // ==========================================
        // 2. 3D НАСТРОЙКА
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 80);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;
        camera.rotation.order = 'YXZ';
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x606060));

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({ color: 0x555555 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const walls = [];
        const wallMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for (let i = 0; i < 15; i++) {
            const box = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 4), wallMat);
            box.position.set((Math.random() - 0.5) * 60, 2.5, (Math.random() - 0.5) * 60);
            if(Math.hypot(box.position.x, box.position.z) > 10) { scene.add(box); walls.push(box); }
        }

        function createStickman(color, nameText) {
            const group = new THREE.Group();
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshLambertMaterial({ color: color }));
            head.position.y = 1.7; group.add(head);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8), new THREE.MeshLambertMaterial({ color: color }));
            body.position.y = 1.1; group.add(body);
            const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), new THREE.MeshLambertMaterial({ color: color }));
            arm1.position.set(-0.25, 1.2, 0); group.add(arm1);
            const arm2 = arm1.clone(); arm2.position.x = 0.25; group.add(arm2);
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.15), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            leg1.position.set(-0.1, 0.35, 0); group.add(leg1);
            const leg2 = leg1.clone(); leg2.position.x = 0.1; group.add(leg2);
            
            if(nameText) {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.font = "Bold 30px Arial"; ctx.fillStyle = "lime"; ctx.textAlign = "center";
                ctx.fillText(nameText, 128, 40);
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.y = 2.3; sprite.scale.set(4, 1, 1); group.add(sprite);
            }
            return group;
        }

        // ==========================================
        // 3. МУЛЬТИПЛЕЕР (Trystero)
        // ==========================================
        let room = null, gameActive = false, myId = Math.random().toString(36).substr(2, 9);
        let myHp = 100, myKills = 0, lastShootTime = 0;
        let players = {}, bullets = [];
        let sendMove, sendShoot, sendHit;

        function joinGlobalGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';
            document.getElementById('joystick').style.display = 'block';
            document.getElementById('btnShoot').style.display = 'block';
            document.getElementById('stats').innerText = "Загрузка...";
            
            gameActive = true;
            camera.position.set(0, 1.6, 0);

            // Пытаемся подключиться, но даже если сеть упадет, игра запустится локально
            try {
                const config = { appId: 'artem-web-shooter-2026' };
                room = Trystero.joinRoom(config, 'GlobalLobby');
                
                const actions = {
                    move: room.makeAction('move'),
                    shoot: room.makeAction('shoot'),
                    hit: room.makeAction('hit')
                };
                sendMove = actions.move[0]; sendShoot = actions.shoot[0]; sendHit = actions.hit[0];

                room.onPeerJoin(peerId => {
                    players[peerId] = { model: createStickman(0xffaa00, "Player"), hp: 100, x: 0, z: 0, rotY: 0 };
                    scene.add(players[peerId].model);
                    addKillFeed(`Игрок ${peerId.substr(0,4)} зашел!`);
                });

                room.onPeerLeave(peerId => {
                    if(players[peerId]) { scene.remove(players[peerId].model); delete players[peerId]; }
                    addKillFeed(`Игрок отключился.`);
                });

                actions.move[1]((data, peerId) => {
                    if(players[peerId]) {
                        players[peerId].x = data.x; players[peerId].z = data.z; players[peerId].rotY = data.rotY;
                        players[peerId].model.position.set(data.x, 0, data.z);
                        players[peerId].model.rotation.y = data.rotY;
                    }
                });

                actions.shoot[1]((data, peerId) => spawnBullet(data.x, data.z, data.rotY, data.dmg, peerId));
                actions.hit[1]((data, peerId) => takeDamage(data.dmg));
                
            } catch (e) {
                console.log("Сеть не работает: ", e);
                addKillFeed("Одиночный режим");
            }
        }

        function addKillFeed(text) {
            const feed = document.getElementById('killfeed');
            const msg = document.createElement('div');
            msg.innerText = text;
            feed.appendChild(msg);
            setTimeout(() => msg.remove(), 3000);
        }

        function spawnBullet(x, z, rotY, dmg, owner) {
            const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            bMesh.position.set(x, 1.5, z);
            scene.add(bMesh);
            bullets.push({ mesh: bMesh, vx: Math.sin(rotY) * 50, vz: Math.cos(rotY) * 50, owner: owner, dmg: dmg, life: 2.0 });
        }

        function shoot() {
            if (!gameActive) return;
            let now = performance.now();
            let weapon = WEAPONS[save.activeWeapon];
            if (now - lastShootTime > weapon.rate) {
                lastShootTime = now;
                spawnBullet(camera.position.x, camera.position.z, yaw, weapon.dmg, myId);
                if(sendShoot) sendShoot({ x: camera.position.x, z: camera.position.z, rotY: yaw, dmg: weapon.dmg });
            }
        }

        function takeDamage(dmg) {
            myHp -= dmg;
            if (myHp <= 0) {
                myHp = 100;
                camera.position.set(0, 1.6, 0);
                addKillFeed("Тебя убили!");
            }
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.x += b.vx * delta;
                b.mesh.position.z += b.vz * delta;
                b.life -= delta;
                let hit = false;

                for (let id in players) {
                    if (id !== b.owner) {
                        let p = players[id];
                        if (Math.hypot(b.mesh.position.x - p.x, b.mesh.position.z - p.z) < 1.2) {
                            hit = true;
                            if (b.owner === myId && sendHit) {
                                sendHit({ dmg: b.dmg }, id);
                                myKills++;
                                addKillFeed(`Ты убил ${id.substr(0,4)}!`);
                            }
                        }
                    }
                }

                walls.forEach(w => { if (Math.abs(b.mesh.position.x - w.position.x) < 2 && Math.abs(b.mesh.position.z - w.position.z) < 2) hit = true; });
                if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }
        }

        // ==========================================
        // 4. УПРАВЛЕНИЕ (Touch Events)
        // ==========================================
        let moveX = 0, moveY = 0, yaw = 0, pitch = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- ДЖОЙСТИК ---
        const joy = document.getElementById('joystick');
        const knob = document.getElementById('joyKnob');
        let joyTouchId = null;

        joy.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            joyTouchId = e.changedTouches[0].identifier;
        }, {passive: false});

        joy.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === joyTouchId) {
                    let rect = joy.getBoundingClientRect();
                    let dx = t.clientX - (rect.left + rect.width/2);
                    let dy = t.clientY - (rect.top + rect.height/2);
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 60;
                    if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist; moveY = dy / maxDist;
                }
            }
        }, {passive: false});

        joy.addEventListener('touchend', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (let i=0; i<e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null; moveX = 0; moveY = 0;
                    knob.style.transform = `translate(0px, 0px)`;
                }
            }
        }, {passive: false});

        // --- КАМЕРА ---
        let lookTouchId = null, lastLookX = 0, lastLookY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            for (let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.clientX > window.innerWidth / 3) {
                    lookTouchId = t.identifier;
                    lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        }, {passive: false});

        renderer.domElement.addEventListener('touchmove', (e) => {
            for (let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === lookTouchId) {
                    e.preventDefault();
                    let dx = t.clientX - lastLookX;
                    let dy = t.clientY - lastLookY;
                    yaw -= dx * 0.005; pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, pitch));
                    lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        }, {passive: false});

        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i=0; i<e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
            }
        });

        // --- СТРЕЛЬБА ---
        const btnShoot = document.getElementById('btnShoot');
        btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); shoot(); }, {passive: false});
        window.addEventListener('mousedown', (e) => { if(e.button === 0 && !('ontouchstart' in window)) shoot(); });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
            }
        });
        renderer.domElement.addEventListener('click', () => { if(!('ontouchstart' in window)) renderer.domElement.requestPointerLock(); });

        // ==========================================
        // 5. ГЛАВНЫЙ ЦИКЛ
        // ==========================================
        let lastTime = performance.now();
        let sendTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            let delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            if (gameActive) {
                camera.rotation.set(pitch, yaw, 0);
                
                let speed = 15 * delta; // Увеличил скорость
                let forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
                let right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
                
                let fwdInput = 0, rightInput = 0;
                if(keys['KeyW'] || keys['ArrowUp']) fwdInput += 1;
                if(keys['KeyS'] || keys['ArrowDown']) fwdInput -= 1;
                if(keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
                if(keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
                
                fwdInput -= moveY; rightInput += moveX;

                camera.position.addScaledVector(forward, fwdInput * speed);
                camera.position.addScaledVector(right, rightInput * speed);
                camera.position.y = 1.6;

                updateBullets(delta);

                sendTimer += delta;
                if (sendTimer > 0.1 && sendMove) {
                    sendMove({ x: camera.position.x, z: camera.position.z, rotY: yaw });
                    sendTimer = 0;
                }

                // Выводим отладочную инфу (чтобы понять, двигаемся мы или нет)
                document.getElementById('stats').innerHTML = `X:${moveX.toFixed(1)} Y:${moveY.toFixed(1)} | Pos:${camera.position.x.toFixed(1)}, ${camera.position.z.toFixed(1)} | Убийств: ${myKills}`;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
