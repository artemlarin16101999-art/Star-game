<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web 3D Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-family: sans-serif; font-size: 20px; }
        #joystick {
            position: absolute; bottom: 50px; left: 50px;
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
        }
        #btnShoot {
            position: absolute; bottom: 50px; right: 50px;
            width: 80px; height: 80px;
            background: rgba(255,0,0,0.5); border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 80px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">Попаданий: <span id="score">0</span></div>
    
    <!-- Для мобилок -->
    <div id="joystick"></div>
    <div id="btnShoot">ОГОНЬ</div>

    <script>
        // 1. Настройка сцены
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // Туман

        // 2. Камера (От первого лица)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; // Рост игрока

        // 3. Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Освещение
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 5. Создание пола и стен
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Простые стены
        const wallMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for (let i = 0; i < 10; i++) {
            const boxGeo = new THREE.BoxGeometry(2, 4, 2);
            const box = new THREE.Mesh(boxGeo, wallMat);
            box.position.set((Math.random() - 0.5) * 40, 2, (Math.random() - 0.5) * 40);
            scene.add(box);
        }

        // 6. Мишени (Враги)
        let targets = [];
        let score = 0;
        function spawnTarget() {
            const targetGeo = new THREE.SphereGeometry(1, 16, 16);
            const targetMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const target = new THREE.Mesh(targetGeo, targetMat);
            target.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
            scene.add(target);
            targets.push(target);
        }
        for(let i=0; i<5; i++) spawnTarget();

        // 7. Управление (Мобилки + ПК)
        let moveX = 0, moveY = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Простая логика мобильного джойстика
        const joy = document.getElementById('joystick');
        let joyTouchId = null;
        joy.addEventListener('touchstart', e => { joyTouchId = e.changedTouches[0].identifier; });
        joy.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) {
                    let rect = joy.getBoundingClientRect();
                    let dx = t.clientX - (rect.left + rect.width/2);
                    let dy = t.clientY - (rect.top + rect.height/2);
                    moveX = dx / 50; moveY = dy / 50;
                }
            }
        }, {passive: false});
        joy.addEventListener('touchend', () => { joyTouchId = null; moveX = 0; moveY = 0; });

        // Поворот камеры свайпом по экрану
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;
        renderer.domElement.addEventListener('touchstart', e => {
            for(let t of e.changedTouches) {
                if(t.clientX > window.innerWidth / 3) { // Свайп только в правой части экрана
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });
        renderer.domElement.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === lookTouchId) {
                    let dx = t.clientX - lastTouchX;
                    let dy = t.clientY - lastTouchY;
                    camera.rotation.y -= dx * 0.005;
                    camera.rotation.x -= dy * 0.005;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x)); // Ограничение по X
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, {passive: false});
        renderer.domElement.addEventListener('touchend', () => { lookTouchId = null; });

        // 8. Стрельба (Raycaster)
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0); // Центр экрана (прицел)

        function shoot() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(targets);
            
            if (intersects.length > 0) {
                // Попали в мишень
                scene.remove(intersects[0].object);
                targets = targets.filter(t => t !== intersects[0].object);
                score++;
                document.getElementById('score').innerText = score;
                spawnTarget(); // Спавним новую
            }
        }

        document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        window.addEventListener('mousedown', (e) => { if(e.button === 0) shoot(); });

        // 9. Главный цикл
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            let delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            // Движение
            let speed = 10 * delta;
            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            
            // Обработка ввода (клавиатура + мобилка)
            let fwdInput = 0, rightInput = 0;
            if(keys['KeyW'] || keys['ArrowUp']) fwdInput += 1;
            if(keys['KeyS'] || keys['ArrowDown']) fwdInput -= 1;
            if(keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
            if(keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
            
            fwdInput -= moveY; // Джойстик вверх = вперед
            rightInput += moveX;

            camera.position.addScaledVector(forward, fwdInput * speed);
            camera.position.addScaledVector(right, rightInput * speed);
            camera.position.y = 1.6; // Держим на одной высоте

            // ПК мышь для поворота
            if (document.pointerLockElement === renderer.domElement) {
                document.addEventListener('mousemove', (e) => {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        // Клик по экрану для захвата мыши (на ПК)
        renderer.domElement.addEventListener('click', () => {
            if(!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
