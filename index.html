<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Web 3D Shooter: ULTIMATE EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/trystero@0.21.0/dist/trystero-mqtt.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; color: #fff; }
        canvas { display: block; }
        
        /* --- МЕНЮ --- */
        #authScreen, #menu, #shopMenu, #settingsMenu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a2a2a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }
        #menu, #shopMenu, #settingsMenu { display: none; overflow-y: auto; padding: 20px 0; }
        .input-box { padding: 12px; margin: 6px; font-size: 16px; border-radius: 8px; border: 2px solid #444; background: #1a1a1a; color: #fff; width: 260px; text-align: center; outline: none; }
        .input-box:focus { border-color: #ffcc00; }
        .btn { padding: 12px 20px; margin: 6px; font-size: 16px; border: none; border-radius: 8px; background: linear-gradient(180deg, #ffd700 0%, #ffaa00 100%); color: #000; font-weight: 800; cursor: pointer; width: 260px; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%); font-size: 18px; }
        .btn-red { background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%); color: #fff; }
        .btn-blue { background: linear-gradient(180deg, #00aaff 0%, #0077cc 100%); color: #fff; }
        
        .shop-item { background: rgba(255,255,255,0.1); padding: 12px 15px; margin: 5px; border-radius: 8px; width: 280px; display: flex; justify-content: space-between; align-items: center; }
        
        .setting-row { background: rgba(255,255,255,0.05); padding: 10px 15px; margin: 5px; border-radius: 8px; width: 280px; display: flex; flex-direction: column; gap: 5px; }
        .setting-row label { font-weight: bold; font-size: 14px; }
        input[type=range] { width: 100%; accent-color: #00ffcc; }
        
        /* --- HUD --- */
        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        
        /* Кастомный прицел */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0; height: 0; pointer-events: none; z-index: 60; }
        .ch-line { position: absolute; background: var(--ch-color, #00ffcc); border-radius: 1px; }
        .ch-dot { position: absolute; background: var(--ch-color, #00ffcc); top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; }
        
        #stats { position: absolute; top: 20px; left: 20px; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; line-height: 1.8; border-left: 4px solid #00ffcc; }
        #weaponUI { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 25px; border-radius: 8px; border-bottom: 3px solid #ffcc00; }
        #killfeed { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
        .kill-msg { background: rgba(255,0,0,0.7); padding: 5px 10px; border-radius: 5px; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        
        /* --- УПРАВЛЕНИЕ --- */
        .ui-element { position: absolute; z-index: 100; touch-action: none; border-radius: 50%; display: none; text-align: center; font-weight: bold; border: 3px solid rgba(255,255,255,0.3); box-shadow: inset 0 0 20px rgba(0,0,0,0.5); transform-origin: center; }
        #joystick { width: 130px; height: 130px; background: rgba(255,255,255,0.1); bottom: 40px; left: 40px; }
        #joyKnob { position: absolute; top: 35px; left: 35px; width: 60px; height: 60px; background: radial-gradient(circle, #fff 0%, #aaa 100%); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #btnShoot { width: 100px; height: 100px; background: rgba(255,0,0,0.4); border-color: rgba(255,0,0,0.6); line-height: 100px; bottom: 40px; right: 40px; font-size: 20px; color: #fff; text-shadow: 0 0 5px #000; }
        #btnJump { width: 70px; height: 70px; background: rgba(0,150,255,0.4); border-color: rgba(0,150,255,0.6); line-height: 70px; bottom: 160px; right: 40px; font-size: 14px; }
        #btnCrouch { width: 70px; height: 70px; background: rgba(255,150,0,0.4); border-color: rgba(255,150,0,0.6); line-height: 70px; bottom: 160px; right: 130px; font-size: 14px; }
        #btnAds { width: 70px; height: 70px; background: rgba(0,255,150,0.4); border-color: rgba(0,255,150,0.6); line-height: 70px; bottom: 40px; right: 160px; font-size: 14px; }
        #btnReload { width: 70px; height: 70px; background: rgba(150,150,150,0.4); border-color: rgba(150,150,150,0.6); line-height: 70px; bottom: 250px; right: 40px; font-size: 14px; }
        
        #exitBtn { display: none; position: absolute; top: 20px; right: 20px; padding: 12px 25px; background: rgba(255,0,0,0.8); color: #fff; border: none; border-radius: 8px; z-index: 100; font-weight: bold; pointer-events: auto; cursor: pointer; }
        
        .edit-mode { border: 3px dashed #fff !important; background: rgba(255,255,255,0.4) !important; box-shadow: 0 0 20px #fff; }
        #editBar { display: none; position: absolute; top: 0; left: 0; width: 100%; background: #ffcc00; color: #000; text-align: center; padding: 15px; font-weight: bold; z-index: 300; display: flex; justify-content: center; align-items: center; gap: 20px;}
    </style>
</head>
<body>

    <div id="editBar">
        <span>РЕДАКТОР: Двигай кнопки. Масштаб: <input type="range" id="uiScaleSlider" min="0.5" max="2" step="0.1" value="1" style="width:80px; vertical-align:middle;"></span>
        <button style="padding: 8px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer;" onclick="saveUI()">СОХРАНИТЬ</button>
    </div>

    <div id="authScreen">
        <h1 style="color: #ffcc00;">ВХОД</h1>
        <input type="text" id="authUser" class="input-box" placeholder="Никнейм">
        <input type="password" id="authPass" class="input-box" placeholder="Пароль">
        <button class="btn" onclick="login()">ВОЙТИ</button>
    </div>

    <div id="menu">
        <h1 style="font-size: 34px; letter-spacing: 2px;">WEB 3D SHOOTER</h1>
        <p>Игрок: <span id="menuUser" style="color: #00ffcc;"></span> | Баланс: <span id="menuCoins" style="color: #ffcc00;">0</span> 🪙</p>
        
        <select id="mapSelect" class="input-box">
            <option value="dust2">Dust 2 (A-Site)</option>
            <option value="mirage">Mirage (Palace)</option>
            <option value="nuketown">Nuketown (Арена)</option>
        </select>

        <button class="btn btn-green" onclick="joinGame()">В БОЙ (ОНЛАЙН)</button>
        <button class="btn btn-blue" onclick="showMenu('shopMenu')">МАГАЗИН</button>
        <button class="btn" onclick="showMenu('settingsMenu')">НАСТРОЙКИ</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="promoInput" class="input-box" placeholder="Промокод" style="width: 150px;">
            <button class="btn" style="width: auto;" onclick="applyPromo()">ОК</button>
        </div>
    </div>

    <div id="shopMenu">
        <h1>МАГАЗИН</h1>
        <p>Монеты: <span id="shopCoins" style="color:#ffcc00;">0</span> 🪙</p>
        <div class="shop-item"><span>Винтовка (35 DMG)</span><button class="btn" style="width:auto;" onclick="buyWeapon('rifle', 100)">100</button></div>
        <div class="shop-item"><span>Автомат (25 DMG)</span><button class="btn" style="width:auto;" onclick="buyWeapon('smg', 200)">200</button></div>
        <div class="shop-item"><span>Снайперка (100 DMG)</span><button class="btn" style="width:auto;" onclick="buyWeapon('sniper', 300)">300</button></div>
        <button class="btn btn-red" onclick="showMenu('menu')">НАЗАД</button>
    </div>

    <div id="settingsMenu">
        <h1>НАСТРОЙКИ</h1>
        
        <div class="setting-row">
            <label>Чувствительность: <span id="sensVal">1.0</span></label>
            <input type="range" id="sensSlider" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="setting-row">
            <label>Зум прицела (FOV): <span id="zoomVal">45</span></label>
            <input type="range" id="zoomSlider" min="20" max="70" step="5" value="45">
        </div>
        
        <h3 style="margin-top:15px; color:#ffcc00;">Прицел (Crosshair)</h3>
        <div class="setting-row">
            <label>Цвет: <input type="color" id="chColor" value="#00ffcc" style="vertical-align:middle; width:30px; height:30px; border:none; background:none; cursor:pointer;"></label>
            <label>Длина: <span id="chLenVal">10</span> <input type="range" id="chLen" min="2" max="30" value="10"></label>
            <label>Толщина: <span id="chThickVal">2</span> <input type="range" id="chThick" min="1" max="10" value="2"></label>
            <label>Зазор: <span id="chGapVal">4</span> <input type="range" id="chGap" min="0" max="20" value="4"></label>
            <label><input type="checkbox" id="chDot" checked> Точка в центре</label>
        </div>

        <button class="btn" onclick="startEditUI()">РАСПОЛОЖЕНИЕ КНОПОК</button>
        <button class="btn btn-red" onclick="saveSettings()">СОХРАНИТЬ И ВЫЙТИ</button>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <button id="exitBtn" onclick="leaveGame()">ВЫЙТИ</button>
        <div id="stats">
            HP: <span id="hudHp">100</span><br>
            Скорость: <span id="hudSpeed">10</span><br>
            Убийств: <span id="hudKills">0</span>
        </div>
        <div id="weaponUI"><span id="hudWeapon">Пистолет</span> | <span id="hudAmmo">12/12</span></div>
        <div id="killfeed"></div>
    </div>

    <div id="joystick" class="ui-element"><div id="joyKnob"></div></div>
    <div id="btnShoot" class="ui-element">ОГОНЬ</div>
    <div id="btnJump" class="ui-element">ПРЫЖОК</div>
    <div id="btnCrouch" class="ui-element">ПРИСЕСТЬ</div>
    <div id="btnAds" class="ui-element">ПРИЦЕЛ</div>
    <div id="btnReload" class="ui-element">RELOAD</div>

    <script>
        // ==========================================
        // 1. АУДИО
        // ==========================================
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSnd(type) {
            if (!audioCtx) return;
            let o = audioCtx.createOscillator(), g = audioCtx.createGain();
            if (type === 'step') {
                o.type = 'triangle'; o.frequency.setValueAtTime(80 + Math.random() * 20, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            } else if (type === 'shoot') {
                o.type = 'square'; o.frequency.setValueAtTime(250, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                o.type = 'sine'; o.frequency.setValueAtTime(800, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            }
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.2);
        }

        // ==========================================
        // 2. АККАУНТЫ И НАСТРОЙКИ
        // ==========================================
        let currentUser = null;
        let save = {
            coins: 0, weapons: ["pistol"], activeWeapon: "pistol", usedPromos: [],
            sensitivity: 1.0, scopeFov: 45, uiScale: 1.0, uiPos: {},
            chColor: "#00ffcc", chLen: 10, chThick: 2, chGap: 4, chDot: true
        };

        const WEAPONS = {
            pistol: { name: "Пистолет", dmg: 20, rate: 300, ammo: 12, maxAmmo: 12, reloadTime: 1.5, recoil: 0.1, spread: 0 },
            rifle:  { name: "Винтовка", dmg: 35, rate: 150, ammo: 30, maxAmmo: 30, reloadTime: 2.0, recoil: 0.05, spread: 0.02 },
            smg:    { name: "Автомат", dmg: 25, rate: 80,  ammo: 40, maxAmmo: 40, reloadTime: 2.2, recoil: 0.03, spread: 0.05 },
            sniper: { name: "Снайперка", dmg: 100, rate: 1500, ammo: 5, maxAmmo: 5, reloadTime: 3.0, recoil: 0.2, spread: 0 }
        };
        let ammoState = { pistol: 12, rifle: 30, smg: 40, sniper: 5 };
        let isReloading = false;

        function login() {
            let u = document.getElementById('authUser').value.trim(), p = document.getElementById('authPass').value;
            if (!u || !p) return alert("Заполни поля!");
            let sp = localStorage.getItem('fps_pass_' + u);
            if (sp) { if (sp !== p) return alert("Неверный пароль!"); } 
            else { localStorage.setItem('fps_pass_' + u, p); }
            currentUser = u; localStorage.setItem('fps_active_user', u); loadSave(); showMenu('menu');
        }

        function loadSave() {
            let s = localStorage.getItem('fps_save_' + currentUser);
            if (s) {
                save = { ...save, ...JSON.parse(s) };
            } else { saveData(); }
            updateSettingsUI();
            updateCoins();
        }

        function saveData() { if (currentUser) localStorage.setItem('fps_save_' + currentUser, JSON.stringify(save)); }
        function updateCoins() { document.getElementById('menuCoins').innerText = save.coins; document.getElementById('shopCoins').innerText = save.coins; }
        
        window.onload = () => { let a = localStorage.getItem('fps_active_user'); if (a) { currentUser = a; loadSave(); showMenu('menu'); } };

        // UI Settings Sync
        function updateSettingsUI() {
            document.getElementById('sensSlider').value = save.sensitivity;
            document.getElementById('sensVal').innerText = save.sensitivity.toFixed(1);
            document.getElementById('zoomSlider').value = save.scopeFov;
            document.getElementById('zoomVal').innerText = save.scopeFov;
            
            document.getElementById('chColor').value = save.chColor;
            document.getElementById('chLen').value = save.chLen;
            document.getElementById('chLenVal').innerText = save.chLen;
            document.getElementById('chThick').value = save.chThick;
            document.getElementById('chThickVal').innerText = save.chThick;
            document.getElementById('chGap').value = save.chGap;
            document.getElementById('chGapVal').innerText = save.chGap;
            document.getElementById('chDot').checked = save.chDot;
            
            applyCrosshair();
            applyUIScale(save.uiScale);
            document.getElementById('uiScaleSlider').value = save.uiScale;
        }

        // Ивенты настроек
        document.getElementById('sensSlider').addEventListener('input', function() { save.sensitivity = parseFloat(this.value); document.getElementById('sensVal').innerText = this.value; });
        document.getElementById('zoomSlider').addEventListener('input', function() { save.scopeFov = parseInt(this.value); document.getElementById('zoomVal').innerText = this.value; });
        document.getElementById('chColor').addEventListener('input', function() { save.chColor = this.value; applyCrosshair(); });
        document.getElementById('chLen').addEventListener('input', function() { save.chLen = parseInt(this.value); document.getElementById('chLenVal').innerText = this.value; applyCrosshair(); });
        document.getElementById('chThick').addEventListener('input', function() { save.chThick = parseInt(this.value); document.getElementById('chThickVal').innerText = this.value; applyCrosshair(); });
        document.getElementById('chGap').addEventListener('input', function() { save.chGap = parseInt(this.value); document.getElementById('chGapVal').innerText = this.value; applyCrosshair(); });
        document.getElementById('chDot').addEventListener('change', function() { save.chDot = this.checked; applyCrosshair(); });
        document.getElementById('uiScaleSlider').addEventListener('input', function() { applyUIScale(parseFloat(this.value)); save.uiScale = parseFloat(this.value); });

        function applyCrosshair() {
            let el = document.getElementById('crosshair');
            el.innerHTML = '';
            el.style.setProperty('--ch-color', save.chColor);
            
            const createLine = (style) => {
                let div = document.createElement('div');
                div.className = 'ch-line';
                Object.assign(div.style, style);
                el.appendChild(div);
            };
            
            createLine({ width: save.chThick+'px', height: save.chLen+'px', left: '50%', bottom: '50%', marginLeft: -(save.chThick/2)+'px', marginBottom: save.chGap+'px' });
            createLine({ width: save.chThick+'px', height: save.chLen+'px', left: '50%', top: '50%', marginLeft: -(save.chThick/2)+'px', marginTop: save.chGap+'px' });
            createLine({ width: save.chLen+'px', height: save.chThick+'px', top: '50%', right: '50%', marginTop: -(save.chThick/2)+'px', marginRight: save.chGap+'px' });
            createLine({ width: save.chLen+'px', height: save.chThick+'px', top: '50%', left: '50%', marginTop: -(save.chThick/2)+'px', marginLeft: save.chGap+'px' });
            
            if (save.chDot) {
                let d = document.createElement('div');
                d.className = 'ch-dot';
                d.style.width = save.chThick+'px'; d.style.height = save.chThick+'px';
                el.appendChild(d);
            }
        }

        function applyUIScale(scale) {
            const uiElements = ['joystick', 'btnShoot', 'btnJump', 'btnCrouch', 'btnAds', 'btnReload'];
            uiElements.forEach(id => {
                let el = document.getElementById(id);
                el.style.transform = `scale(${scale})`;
            });
            document.getElementById('uiScaleSlider').value = scale;
        }

        function saveSettings() { saveData(); showMenu('menu'); }
        function showMenu(id) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('shopMenu').style.display = 'none';
            document.getElementById('settingsMenu').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('editBar').style.display = 'none';
            hideUI();
            document.getElementById(id).style.display = 'flex';
            if (id === 'menu') document.getElementById('menuUser').innerText = currentUser;
        }
        function buyWeapon(w, price) {
            if (save.coins >= price && !save.weapons.includes(w)) {
                save.coins -= price; save.weapons.push(w); save.activeWeapon = w; saveData(); updateCoins(); alert("Куплено!");
            } else alert("Не хватает или уже есть!");
        }
        function applyPromo() {
            if (document.getElementById('promoInput').value.trim() === "Петушара2026") {
                if (save.usedPromos.includes("Петушара2026")) return alert("Уже активирован!");
                save.coins += 1000; save.usedPromos.push("Петушара2026"); saveData(); updateCoins(); alert("+1000 монет!");
            } else alert("Неверный код.");
        }

        // ==========================================
        // 3. РЕДАКТОР ИНТЕРФЕЙСА (Drag & Drop)
        // ==========================================
        let isEditingUI = false;
        const uiElements = ['joystick', 'btnShoot', 'btnJump', 'btnCrouch', 'btnAds', 'btnReload'];
        
        function hideUI() { uiElements.forEach(id => document.getElementById(id).style.display = 'none'); }
        function showUI() { 
            if ('ontouchstart' in window) {
                uiElements.forEach(id => document.getElementById(id).style.display = 'block');
                applySavedPositions();
            }
        }
        function applySavedPositions() {
            uiElements.forEach(id => {
                let el = document.getElementById(id);
                if (save.uiPos && save.uiPos[id]) {
                    el.style.left = save.uiPos[id].left + 'px';
                    el.style.top = save.uiPos[id].top + 'px';
                    el.style.bottom = 'auto'; el.style.right = 'auto';
                }
            });
        }
        function startEditUI() {
            document.getElementById('settingsMenu').style.display = 'none';
            document.getElementById('editBar').style.display = 'flex';
            document.getElementById('hud').style.display = 'block';
            isEditingUI = true;
            showUI();
            uiElements.forEach(id => {
                let el = document.getElementById(id);
                el.classList.add('edit-mode');
                el.style.display = 'block';
                el.style.pointerEvents = 'auto';
            });
            applySavedPositions();
        }
        function saveUI() {
            isEditingUI = false;
            document.getElementById('editBar').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            uiElements.forEach(id => document.getElementById(id).classList.remove('edit-mode'));
            saveData();
            showMenu('settingsMenu');
        }

        uiElements.forEach(id => {
            let el = document.getElementById(id), isDragging = false, sX, sY, sL, sT;
            el.addEventListener('touchstart', (e) => {
                if (!isEditingUI) return; e.preventDefault(); e.stopPropagation(); isDragging = true;
                let t = e.touches[0]; sX = t.clientX; sY = t.clientY;
                let r = el.getBoundingClientRect(); sL = r.left; sT = r.top;
            }, {passive: false});
            el.addEventListener('touchmove', (e) => {
                if (!isEditingUI || !isDragging) return; e.preventDefault(); e.stopPropagation();
                let t = e.touches[0];
                let nL = sL + (t.clientX - sX), nT = sT + (t.clientY - sY);
                el.style.left = nL + 'px'; el.style.top = nT + 'px';
                save.uiPos[id] = { left: nL, top: nT };
            }, {passive: false});
            el.addEventListener('touchend', (e) => { if (!isEditingUI) return; e.preventDefault(); e.stopPropagation(); isDragging = false; }, {passive: false});
        });

        // ==========================================
        // 4. 3D НАСТРОЙКА
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 30, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; camera.rotation.order = 'YXZ'; scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
        renderer.shadowMap.enabled = true;

        scene.add(new THREE.AmbientLight(0x404040, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(20, 40, 20); dirLight.castShadow = true; scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
        scene.add(new THREE.GridHelper(200, 100, 0x00ffcc, 0x333333));

        // --- ВЬЮМОДЕЛЬ ПУШКИ ---
        const gunGroup = new THREE.Group(); camera.add(gunGroup);
        const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.4 }));
        gunGroup.add(gunBody);
        const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        gunBarrel.rotation.x = Math.PI / 2; gunBarrel.position.set(0, 0.02, -0.35); gunGroup.add(gunBarrel);
        const gunHandle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        gunHandle.position.set(0, -0.1, 0.1); gunHandle.rotation.x = -0.3; gunGroup.add(gunHandle);
        const muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
        muzzleFlash.position.set(0, 0.02, -0.5); gunGroup.add(muzzleFlash);
        gunGroup.position.set(0.25, -0.25, -0.5); gunGroup.rotation.y = -0.1;
        
        let recoilOffset = 0;

        // --- ПАРТИКЛЫ ---
        const particles = [];
        function spawnParticles(pos, color) {
            for(let i=0; i<5; i++) {
                const pMesh = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshBasicMaterial({ color }));
                pMesh.position.copy(pos); scene.add(pMesh);
                particles.push({ mesh: pMesh, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, vz: (Math.random()-0.5)*5, life: 0.5 });
            }
        }
        function updateParticles(delta) {
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.mesh.position.x += p.vx * delta; p.mesh.position.y += p.vy * delta; p.mesh.position.z += p.vz * delta;
                p.life -= delta; if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
        }

        // --- КАРТЫ ---
        let walls = [];
        function addWall(x, y, z, sx, sy, sz, color, isCrate = false) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: isCrate ? 0.9 : 0.5, metalness: isCrate ? 0.1 : 0.5 });
            const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
            box.scale.set(sx, sy, sz); box.position.set(x, y, z); box.castShadow = true; box.receiveShadow = true;
            scene.add(box); walls.push(box);
            return box;
        }

        function buildMap(name) {
            walls.forEach(w => scene.remove(w)); walls = [];
            const wC = 0x555555, cC = 0x8B5A2B, aC = 0x00ffcc;
            if (name === 'dust2') {
                addWall(0, 2.5, -15, 30, 5, 2, wC); addWall(-15, 2.5, 5, 2, 5, 40, wC);
                addWall(-5, 1.5, -10, 3, 3, 3, cC, true); addWall(-2, 1.5, -12, 3, 3, 3, cC, true);
                addWall(-3.5, 4.5, -11, 2, 3, 2, cC, true); addWall(15, 2.5, -15, 10, 5, 2, wC);
                addWall(10, 2.5, 0, 2, 5, 30, wC); addWall(5, 3, 10, 1, 6, 1, aC); addWall(-5, 3, 10, 1, 6, 1, aC);
            } else if (name === 'mirage') {
                addWall(-15, 3, 0, 2, 6, 30, wC); addWall(-8, 3, 15, 15, 6, 2, wC);
                addWall(5, 4, 5, 2, 8, 2, cC, true); addWall(-5, 4, 5, 2, 8, 2, cC, true);
                addWall(0, 1, -5, 4, 2, 4, cC, true); addWall(10, 2.5, -10, 2, 5, 15, wC); addWall(0, 2.5, 20, 30, 5, 2, wC);
            } else if (name === 'nuketown') {
                addWall(-10, 2.5, -10, 10, 5, 2, wC); addWall(10, 2.5, -10, 10, 5, 2, wC);
                addWall(0, 1.5, 0, 4, 3, 4, cC, true); addWall(-15, 2.5, 10, 2, 5, 20, wC);
                addWall(15, 2.5, 10, 2, 5, 20, wC); addWall(0, 2.5, 20, 20, 5, 2, wC);
                addWall(5, 1.5, -5, 3, 3, 10, 0x00aaff); addWall(-5, 1.5, 5, 3, 3, 10, 0xffaa00);
            }
        }

        // --- МОДЕЛЬ БОТА / ИГРОКА ---
        function createStickman(color, name, hasGun = false) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
            
            // Голова
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
            head.position.y = 1.7; head.castShadow = true; group.add(head);
            // Тело
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.8), mat);
            body.position.y = 1.1; body.castShadow = true; group.add(body);
            // Руки
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), mat);
            armL.position.set(-0.35, 1.1, 0); armL.castShadow = true; group.add(armL);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), mat);
            armR.position.set(0.35, 1.1, 0); armR.castShadow = true; group.add(armR);
            // Ноги
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.15), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            legL.position.set(-0.12, 0.35, 0); legL.castShadow = true; legL.name = "LegL"; group.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.15), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            legR.position.set(0.12, 0.35, 0); legR.castShadow = true; legR.name = "LegR"; group.add(legR);

            // Пушка для бота
            if (hasGun) {
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                gun.position.set(0.35, 1.1, -0.2); group.add(gun);
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2), new THREE.MeshStandardMaterial({ color: 0x333333 }));
                barrel.rotation.x = Math.PI / 2; barrel.position.set(0.35, 1.12, -0.4); group.add(barrel);
            }

            if (name) {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d'); ctx.font = "Bold 32px Arial"; ctx.fillStyle = "#ff4444"; ctx.textAlign = "center"; ctx.fillText(name, 128, 40);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
                sprite.position.y = 2.2; sprite.scale.set(3, 0.75, 1); group.add(sprite);
            }
            return group;
        }

        // ==========================================
        // 5. ЛОГИКА
        // ==========================================
        let gameActive = false, myHp = 100, myKills = 0, lastShootTime = 0;
        let bullets = [], bots = [];
        let velocityY = 0, gravity = -35, jumpForce = 15, onGround = true;
        let currentSpeed = 10, maxSpeed = 100, isJumpHeld = false;
        let isCrouching = false, isAds = false, targetFov = 75, targetHeight = 1.6;
        let keys = {}, moveX = 0, moveY = 0, yaw = 0, pitch = 0, lastStepTime = 0;
        let myId = Math.random().toString(36).substr(2, 9);
        let room = null, sendMove, sendShoot, sendHit, otherPlayers = {};

        function joinGame() {
            initAudio(); buildMap(document.getElementById('mapSelect').value);
            document.getElementById('authScreen').style.display = 'none'; document.getElementById('menu').style.display = 'none';
            document.getElementById('shopMenu').style.display = 'none'; document.getElementById('settingsMenu').style.display = 'none';
            document.getElementById('hud').style.display = 'block'; document.getElementById('exitBtn').style.display = 'block';
            showUI(); gameActive = true; camera.position.set(0, 1.6, 15); myHp = 100; myKills = 0; currentSpeed = 10;
            
            ammoState[save.activeWeapon] = WEAPONS[save.activeWeapon].maxAmmo;
            document.getElementById('hudWeapon').innerText = WEAPONS[save.activeWeapon].name;
            document.getElementById('hudAmmo').innerText = ammoState[save.activeWeapon] + '/' + WEAPONS[save.activeWeapon].maxAmmo;
            
            bots.forEach(b => scene.remove(b.model)); bots = [];
            for(let i = 0; i < 5; i++) spawnBot();

            try {
                const config = { appId: 'artem-web-shooter-max' };
                room = Trystero.joinRoom(config, 'GlobalLobbyMax');
                const actions = { move: room.makeAction('move'), shoot: room.makeAction('shoot'), hit: room.makeAction('hit') };
                sendMove = actions.move[0]; sendShoot = actions.shoot[0]; sendHit = actions.hit[0];
                room.onPeerJoin(id => { otherPlayers[id] = { model: createStickman(0x00ffcc, "Player", true), x: 0, z: 0, rotY: 0 }; scene.add(otherPlayers[id].model); });
                room.onPeerLeave(id => { if(otherPlayers[id]) { scene.remove(otherPlayers[id].model); delete otherPlayers[id]; } });
                actions.move[1]((data, id) => { if(otherPlayers[id]) { otherPlayers[id].x = data.x; otherPlayers[id].z = data.z; otherPlayers[id].rotY = data.rotY; otherPlayers[id].model.position.set(data.x, 0, data.z); otherPlayers[id].model.rotation.y = data.rotY; } });
                actions.shoot[1]((data, id) => { spawnBullet(data.x, data.y, data.z, new THREE.Vector3(data.dx, 0, data.dz), data.dmg, id); });
                actions.hit[1]((data) => { takeDamage(data.dmg); });
            } catch (e) { console.log("Оффлайн режим"); }
        }

        function leaveGame() {
            gameActive = false; document.exitPointerLock(); if (room) room.leave();
            save.coins += 15; saveData(); updateCoins(); showMenu('menu');
        }

        function spawnBot() {
            const model = createStickman(0xff4444, "BOT", true);
            model.position.set((Math.random() - 0.5) * 40, 0, (Math.random() - 0.5) * 40);
            scene.add(model);
            bots.push({ model: model, hp: 100, lastShoot: 0, speed: 3 + Math.random() * 3, walkTime: Math.random() * 10 });
        }

        // Коллизия для ботов
        function checkBotCollision(nx, nz, r = 0.8) {
            for (let w of walls) {
                if (nx > w.position.x - w.scale.x / 2 - r && nx < w.position.x + w.scale.x / 2 + r && 
                    nz > w.position.z - w.scale.z / 2 - r && nz < w.position.z + w.scale.z / 2 + r) return true;
            }
            return false;
        }

        function updateBots(delta) {
            bots.forEach(bot => {
                let dist = Math.hypot(camera.position.x - bot.model.position.x, camera.position.z - bot.model.position.z);
                let angle = Math.atan2(camera.position.x - bot.model.position.x, camera.position.z - bot.model.position.z);
                bot.model.rotation.y = angle;
                
                let isMoving = false;
                if (dist > 8) {
                    let nextX = bot.model.position.x + Math.sin(angle) * bot.speed * delta;
                    let nextZ = bot.model.position.z + Math.cos(angle) * bot.speed * delta;
                    
                    if (!checkBotCollision(nextX, bot.model.position.z)) {
                        bot.model.position.x = nextX;
                        isMoving = true;
                    }
                    if (!checkBotCollision(bot.model.position.x, nextZ)) {
                        bot.model.position.z = nextZ;
                        isMoving = true;
                    }
                }
                
                // Анимация ног
                if (isMoving) {
                    bot.walkTime += delta * 10;
                    let legL = bot.model.getObjectByName("LegL");
                    let legR = bot.model.getObjectByName("LegR");
                    if (legL) legL.rotation.x = Math.sin(bot.walkTime) * 0.8;
                    if (legR) legR.rotation.x = -Math.sin(bot.walkTime) * 0.8;
                } else {
                    let legL = bot.model.getObjectByName("LegL");
                    let legR = bot.model.getObjectByName("LegR");
                    if (legL) legL.rotation.x = 0;
                    if (legR) legR.rotation.x = 0;
                }

                if (dist < 50 && performance.now() - bot.lastShoot > 1500 + Math.random() * 1000) {
                    bot.lastShoot = performance.now();
                    let dir = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle)).normalize();
                    spawnBullet(bot.model.position.x, 1.5, bot.model.position.z, dir, 10, "bot");
                }
            });
        }

        function spawnBullet(x, y, z, dir, dmg, owner) {
            const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            bMesh.position.set(x, y, z); scene.add(bMesh);
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, y, z), new THREE.Vector3(x + dir.x * 4, y, z + dir.z * 4)]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
            scene.add(line); setTimeout(() => scene.remove(line), 50);
            bullets.push({ mesh: bMesh, vx: dir.x * 100, vz: dir.z * 100, owner: owner, dmg: dmg, life: 2.0 });
        }

        function shoot() {
            if (!gameActive || isEditingUI || isReloading) return;
            let now = performance.now(), w = WEAPONS[save.activeWeapon];
            if (now - lastShootTime > w.rate) {
                if (ammoState[save.activeWeapon] <= 0) { reload(); return; }
                lastShootTime = now; playSnd('shoot');
                recoilOffset = 0.15; muzzleFlash.material.opacity = 1; setTimeout(() => muzzleFlash.material.opacity = 0, 50);
                ammoState[save.activeWeapon]--;
                document.getElementById('hudAmmo').innerText = ammoState[save.activeWeapon] + '/' + w.maxAmmo;

                let dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).normalize();
                dir.x += (Math.random() - 0.5) * w.spread;
                dir.z += (Math.random() - 0.5) * w.spread;
                dir.normalize();

                spawnBullet(camera.position.x, camera.position.y - 0.1, camera.position.z, dir, w.dmg, "player");
                if (sendShoot) sendShoot({ x: camera.position.x, y: camera.position.y, z: camera.position.z, dx: dir.x, dz: dir.z, dmg: w.dmg });
            }
        }

        function reload() {
            if (isReloading || ammoState[save.activeWeapon] === WEAPONS[save.activeWeapon].maxAmmo) return;
            isReloading = true; document.getElementById('hudAmmo').innerText = "RELOADING..."; document.getElementById('hudAmmo').style.color = "#ff4444";
            setTimeout(() => {
                ammoState[save.activeWeapon] = WEAPONS[save.activeWeapon].maxAmmo;
                document.getElementById('hudAmmo').innerText = ammoState[save.activeWeapon] + '/' + WEAPONS[save.activeWeapon].maxAmmo;
                document.getElementById('hudAmmo').style.color = "#00ffcc"; isReloading = false;
            }, WEAPONS[save.activeWeapon].reloadTime * 1000);
        }

        function takeDamage(dmg) {
            myHp -= dmg;
            document.getElementById('stats').style.borderLeftColor = "#ff0000"; setTimeout(() => document.getElementById('stats').style.borderLeftColor = "#00ffcc", 200);
            if (myHp <= 0) { myHp = 100; camera.position.set(0, 1.6, 15); addKillfeed("Вас убили!"); }
        }

        function addKillfeed(text) {
            const feed = document.getElementById('killfeed'); const msg = document.createElement('div');
            msg.className = 'kill-msg'; msg.innerText = text; feed.appendChild(msg); setTimeout(() => msg.remove(), 3000);
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.x += b.vx * delta; b.mesh.position.z += b.vz * delta; b.life -= delta;
                let hit = false;
                if (b.owner === "bot") {
                    if (Math.hypot(b.mesh.position.x - camera.position.x, b.mesh.position.z - camera.position.z) < 1.0) {
                        hit = true; takeDamage(b.dmg); spawnParticles(b.mesh.position, 0xff0000);
                    }
                } else if (b.owner === "player") {
                    bots.forEach((bot, idx) => {
                        if (Math.hypot(b.mesh.position.x - bot.model.position.x, b.mesh.position.z - bot.model.position.z) < 1.2) {
                            hit = true; bot.hp -= b.dmg; spawnParticles(b.mesh.position, 0xffaa00); playSnd('hit');
                            if (bot.hp <= 0) { scene.remove(bot.model); bots.splice(idx, 1); myKills++; addKillfeed("Вы убили бота"); setTimeout(spawnBot, 2000); }
                        }
                    });
                } else {
                    for (let id in otherPlayers) {
                        if (id !== b.owner) {
                            let p = otherPlayers[id];
                            if (Math.hypot(b.mesh.position.x - p.x, b.mesh.position.z - p.z) < 1.2) {
                                hit = true; spawnParticles(b.mesh.position, 0xff0000);
                                if (b.owner === myId && sendHit) { sendHit({ dmg: b.dmg }, id); myKills++; addKillfeed("Вы убили игрока"); }
                            }
                        }
                    }
                }
                walls.forEach(w => { if (Math.abs(b.mesh.position.x - w.position.x) < w.scale.x / 2 && Math.abs(b.mesh.position.z - w.position.z) < w.scale.z / 2) { hit = true; spawnParticles(b.mesh.position, 0x888888); } });
                if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }
        }

        function checkCollision(nx, nz) {
            let r = 0.8;
            for (let w of walls) {
                if (nx > w.position.x - w.scale.x / 2 - r && nx < w.position.x + w.scale.x / 2 + r && nz > w.position.z - w.scale.z / 2 - r && nz < w.position.z + w.scale.z / 2 + r) return true;
            }
            return false;
        }

        // ==========================================
        // 6. УПРАВЛЕНИЕ
        // ==========================================
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && onGround && gameActive && !isEditingUI) { velocityY = jumpForce; onGround = false; currentSpeed = Math.min(currentSpeed + 5, maxSpeed); isJumpHeld = true; }
            if (e.code === 'KeyC' && gameActive) { isCrouching = true; targetHeight = 1.0; }
            if (e.code === 'ShiftLeft' && gameActive) { isAds = true; targetFov = save.scopeFov; }
            if (e.code === 'KeyR' && gameActive) reload();
            if (e.code === 'Digit1' && save.weapons.includes('pistol')) switchWeapon('pistol');
            if (e.code === 'Digit2' && save.weapons.includes('rifle')) switchWeapon('rifle');
            if (e.code === 'Digit3' && save.weapons.includes('smg')) switchWeapon('smg');
            if (e.code === 'Digit4' && save.weapons.includes('sniper')) switchWeapon('sniper');
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'Space') isJumpHeld = false;
            if (e.code === 'KeyC') { isCrouching = false; targetHeight = 1.6; }
            if (e.code === 'ShiftLeft') { isAds = false; targetFov = 75; }
        });

        function switchWeapon(w) {
            save.activeWeapon = w; ammoState[w] = WEAPONS[w].maxAmmo;
            document.getElementById('hudWeapon').innerText = WEAPONS[w].name;
            document.getElementById('hudAmmo').innerText = ammoState[w] + '/' + WEAPONS[w].maxAmmo;
            document.getElementById('weaponUI').style.borderBottomColor = "#ffcc00"; setTimeout(() => document.getElementById('weaponUI').style.borderBottomColor = "#00ffcc", 300);
        }

        const joy = document.getElementById('joystick'), knob = document.getElementById('joyKnob');
        let joyTouchId = null;
        joy.addEventListener('touchstart', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); joyTouchId = e.changedTouches[0].identifier; }, { passive: false });
        joy.addEventListener('touchmove', (e) => {
            if (isEditingUI) return; e.preventDefault(); e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === joyTouchId) {
                    let rect = joy.getBoundingClientRect(), dx = t.clientX - (rect.left + rect.width / 2), dy = t.clientY - (rect.top + rect.height / 2), dist = Math.hypot(dx, dy), maxDist = 60;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist; moveY = dy / maxDist;
                }
            }
        }, { passive: false });
        joy.addEventListener('touchend', (e) => {
            if (isEditingUI) return; e.preventDefault(); e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) { joyTouchId = null; moveX = 0; moveY = 0; knob.style.transform = `translate(0px, 0px)`; }
            }
        }, { passive: false });

        let lookTouchId = null, lastLookX = 0, lastLookY = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (isEditingUI) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i], isRightBottom = (t.clientX > window.innerWidth - 180 && t.clientY > window.innerHeight - 180);
                if (t.clientX > window.innerWidth / 3 && !isRightBottom) { lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; }
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (isEditingUI) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === lookTouchId) {
                    e.preventDefault(); let dx = t.clientX - lastLookX, dy = t.clientY - lastLookY, sensMult = isAds ? 0.4 : 1.0;
                    yaw -= dx * 0.005 * save.sensitivity * sensMult; pitch -= dy * 0.005 * save.sensitivity * sensMult;
                    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
                    lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', () => { lookTouchId = null; });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && !isEditingUI) {
                let sensMult = isAds ? 0.4 : 1.0;
                yaw -= e.movementX * 0.002 * save.sensitivity * sensMult; pitch -= e.movementY * 0.002 * save.sensitivity * sensMult;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            }
        });
        renderer.domElement.addEventListener('click', () => { if (!('ontouchstart' in window) && gameActive && !isEditingUI) renderer.domElement.requestPointerLock(); });

        document.getElementById('btnShoot').addEventListener('pointerdown', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); shoot(); });
        document.getElementById('btnReload').addEventListener('touchstart', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); reload(); }, { passive: false });
        document.getElementById('btnJump').addEventListener('touchstart', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); if (onGround && gameActive) { velocityY = jumpForce; onGround = false; currentSpeed = Math.min(currentSpeed + 5, maxSpeed); isJumpHeld = true; } }, { passive: false });
        document.getElementById('btnJump').addEventListener('touchend', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); isJumpHeld = false; }, { passive: false });
        document.getElementById('btnCrouch').addEventListener('touchstart', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); isCrouching = true; targetHeight = 1.0; }, { passive: false });
        document.getElementById('btnCrouch').addEventListener('touchend', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); isCrouching = false; targetHeight = 1.6; }, { passive: false });
        document.getElementById('btnAds').addEventListener('touchstart', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); isAds = true; targetFov = save.scopeFov; }, { passive: false });
        document.getElementById('btnAds').addEventListener('touchend', (e) => { if (isEditingUI) return; e.preventDefault(); e.stopPropagation(); isAds = false; targetFov = 75; }, { passive: false });

        // ==========================================
        // 7. ГЛАВНЫЙ ЦИКЛ
        // ==========================================
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            let delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            if (gameActive && !isEditingUI) {
                camera.rotation.set(pitch, yaw, 0);
                
                if (Math.abs(camera.fov - targetFov) > 0.1) {
                    camera.fov += (targetFov - camera.fov) * 15 * delta; camera.updateProjectionMatrix();
                    document.getElementById('crosshair').style.transform = `translate(-50%, -50%) scale(${isAds ? 0.5 : 1})`;
                }
                if (Math.abs(camera.position.y - targetHeight) > 0.05) { camera.position.y += (targetHeight - camera.position.y) * 15 * delta; }
                if (recoilOffset > 0) { recoilOffset -= 4 * delta; if (recoilOffset < 0) recoilOffset = 0; }
                gunGroup.position.z = -0.5 + recoilOffset; gunGroup.rotation.x = recoilOffset * 0.5;

                let forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation), right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
                let fwdInput = 0, rightInput = 0;
                if (keys['KeyW'] || keys['ArrowUp']) fwdInput += 1;
                if (keys['KeyS'] || keys['ArrowDown']) fwdInput -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
                fwdInput -= moveY; rightInput += moveX;

                let moveVec = new THREE.Vector3(); moveVec.addScaledVector(forward, fwdInput); moveVec.addScaledVector(right, rightInput);
                if (moveVec.length() > 0) {
                    moveVec.normalize(); let speedMult = isCrouching ? 0.5 : 1.0, moveSpeed = currentSpeed * speedMult * delta;
                    let nextX = camera.position.x + moveVec.x * moveSpeed; if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                    let nextZ = camera.position.z + moveVec.z * moveSpeed; if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
                    if (onGround) currentSpeed = Math.max(10, currentSpeed - 25 * delta);
                    if (onGround && performance.now() - lastStepTime > 400 - currentSpeed * 2) { playSnd('step'); lastStepTime = performance.now(); }
                }

                // Прыжок и гравитация (Hold)
                if (!onGround || velocityY > 0) {
                    camera.position.y += velocityY * delta;
                    if (!isJumpHeld && velocityY > 0) { velocityY -= 80 * delta; } 
                    else { velocityY += gravity * delta; }
                }
                if (camera.position.y <= targetHeight) { camera.position.y = targetHeight; velocityY = 0; onGround = true; } else { onGround = false; }

                camera.position.x = Math.max(-90, Math.min(90, camera.position.x));
                camera.position.z = Math.max(-90, Math.min(90, camera.position.z));

                if (sendMove) sendMove({ x: camera.position.x, z: camera.position.z, rotY: yaw });
                
                updateBots(delta); updateBullets(delta); updateParticles(delta);

                document.getElementById('hudHp').innerText = Math.max(0, myHp);
                document.getElementById('hudKills').innerText = myKills;
                document.getElementById('hudSpeed').innerText = Math.round(currentSpeed);
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
