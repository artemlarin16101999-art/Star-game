<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web 3D Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Убираем выделение и скролл на телефоне */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; touch-action: none; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Клики проходят сквозь прицел */
        }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; pointer-events: none; }
        
        /* Джойстик */
        #joystick {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            touch-action: none;
        }
        
        /* Кнопка выстрела */
        #btnShoot {
            position: absolute; bottom: 50px; right: 50px;
            width: 90px; height: 90px;
            background: rgba(255,0,0,0.6); border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 90px;
            font-size: 18px; touch-action: none; z-index: 10; /* z-index чтобы кнопка была поверх всего */
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">Попаданий: <span id="score">0</span></div>
    <div id="joystick"></div>
    <div id="btnShoot">ОГОНЬ</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;
        
        // Важно: используем YXZ порядок вращения для FPS (чтобы камера не крутилась волчком)
        camera.rotation.order = 'YXZ'; 
        let pitch = 0; // Верх/низ
        let yaw = 0;   // Лево/право

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Мир
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const wallMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for (let i = 0; i < 15; i++) {
            const boxGeo = new THREE.BoxGeometry(3, 5, 3);
            const box = new THREE.Mesh(boxGeo, wallMat);
            box.position.set((Math.random() - 0.5) * 50, 2.5, (Math.random() - 0.5) * 50);
            scene.add(box);
        }

        // Враги
        let targets = [];
        let score = 0;
        function spawnTarget() {
            const targetGeo = new THREE.SphereGeometry(1, 16, 16);
            const targetMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const target = new THREE.Mesh(targetGeo, targetMat);
            let x = (Math.random() - 0.5) * 40;
            let z = (Math.random() - 0.5) * 40;
            if (Math.hypot(x, z) < 5) { x += 10; z += 10; }
            target.position.set(x, 1, z);
            scene.add(target);
            targets.push(target);
        }
        for(let i = 0; i < 10; i++) spawnTarget();

        // Управление
        let moveX = 0, moveY = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Джойстик (Ходьба)
        const joy = document.getElementById('joystick');
        let joyTouchId = null;
        joy.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); joyTouchId = e.changedTouches[0].identifier; }, {passive: false});
        joy.addEventListener('touchmove', e => {
            e.preventDefault(); e.stopPropagation();
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) {
                    let rect = joy.getBoundingClientRect();
                    let dx = t.clientX - (rect.left + rect.width/2);
                    let dy = t.clientY - (rect.top + rect.height/2);
                    moveX = Math.max(-1, Math.min(1, dx / 60)); 
                    moveY = Math.max(-1, Math.min(1, dy / 60));
                }
            }
        }, {passive: false});
        joy.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); joyTouchId = null; moveX = 0; moveY = 0; }, {passive: false});

        // Поворот камеры (Свайп по правой части экрана)
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;
        
        // Слушаем свайп прямо на окне, но игнорируем, если палец попал на джойстик или кнопку
        window.addEventListener('touchstart', e => {
            for(let t of e.changedTouches) {
                // Проверяем, что тач не на UI (кнопках)
                if(t.target === renderer.domElement && t.clientX > window.innerWidth / 3) {
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === lookTouchId) {
                    e.preventDefault();
                    let dx = t.clientX - lastTouchX;
                    let dy = t.clientY - lastTouchY;
                    
                    // Изменяем yaw и pitch
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    
                    // Ограничиваем наклон вверх/вниз (чтобы не переворачивался)
                    pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
                    
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, {passive: false});
        
        window.addEventListener('touchend', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === lookTouchId) lookTouchId = null;
            }
        });

        // Стрельба
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function shoot() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0) {
                scene.remove(intersects[0].object);
                targets = targets.filter(t => t !== intersects[0].object);
                score++;
                document.getElementById('score').innerText = score;
                spawnTarget();
            }
        }

        const shootBtn = document.getElementById('btnShoot');
        // Блокируем событие всплытия, чтобы камера не дергалась при выстреле
        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); shoot(); }, {passive: false});
        
        // Для ПК
        window.addEventListener('mousedown', (e) => { if(e.button === 0 && !('ontouchstart' in window)) shoot(); });
        renderer.domElement.addEventListener('click', () => {
            if(!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
            }
        });

        // Игровой цикл
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            let delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            // Применяем поворот к камере
            camera.rotation.set(pitch, yaw, 0);

            let speed = 8 * delta;
            let forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            let right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
            
            // Ввод
            let fwdInput = 0, rightInput = 0;
            if(keys['KeyW'] || keys['ArrowUp']) fwdInput += 1;
            if(keys['KeyS'] || keys['ArrowDown']) fwdInput -= 1;
            if(keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
            if(keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
            
            fwdInput -= moveY; 
            rightInput += moveX;

            // Физика движения
            camera.position.addScaledVector(forward, fwdInput * speed);
            camera.position.addScaledVector(right, rightInput * speed);
            camera.position.y = 1.6;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
